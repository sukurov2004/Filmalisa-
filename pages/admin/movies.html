<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="../../assets/client/İconsİmages/logo.svg"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../global/reset.css" />
    <link rel="stylesheet" href="../../styles/admin/movies.css" />
    <link rel="stylesheet" href="../../global/adminGlobal.css" />
    <title>Admin / Movies</title>
  </head>
  <body>
    <!-- GLOBAL LOADER -->
    <div id="globalLoader" class="loader-overlay">
      <div class="jimu-primary-loading"></div>
    </div>

    <div class="app">
      <aside class="sidebar">
        <div>
          <div class="brand">
            <img src="../../assets/Admin/images/logo.svg" alt="logo" />
            <span>filmalisa</span>
          </div>
          <nav class="menu">
            <a href="dashboard.html" class="item"
              ><img
                src="../../assets/Admin/icons/Dashboard.svg"
                alt=""
              />Dashboard</a
            >
            <a href="movies.html" class="item"
              ><img src="../../assets/Admin/icons/Movies.svg" alt="" />Movies</a
            >
            <a href="categories.html" class="item"
              ><img
                src="../../assets/Admin/icons/Categories.svg"
                alt=""
              />Categories</a
            >
            <a href="users.html" class="item"
              ><img src="../../assets/Admin/icons/Users.svg" alt="" />Users</a
            >
            <a href="comments.html" class="item"
              ><img
                src="../../assets/Admin/icons/Comments.svg"
                alt=""
              />Comments</a
            >
            <a href="contactus.html" class="item"
              ><img
                src="../../assets/Admin/icons/Contactus.svg"
                alt=""
              />Contact us</a
            >
            <a href="actors.html" class="item"
              ><img src="../../assets/Admin/icons/Actors.svg" alt="" />Actors</a
            >
          </nav>
        </div>
        <a href="login.html" class="logout">
          <img src="../../assets/Admin/icons/Logout.svg" alt="" />Logout
        </a>
      </aside>

      <div class="delete-overlay" id="deleteModal">
        <div class="modal">
          <h2>Delete Movie</h2>
          <p>Are you sure you want to delete this movie?</p>
          <div class="modal-actions">
            <button class="btn cancel-btn">Cancel</button>
            <button class="btn delete-btn">Delete</button>
          </div>
        </div>
      </div>

      <main class="main">
        <header class="topbar">
          <div>
            <div class="hi">Hi Admin</div>
            <h1>Movies</h1>
          </div>
          <div class="profile">
            <button id="createBtn" class="create-btn">Create</button>
            <img src="../../assets/Admin/images/profilimg.svg" alt="" />
            <span>Admin</span>
          </div>
        </header>

        <section class="table-wrapper">
          <table class="movies-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Overview</th>
                <th>Category</th>
                <th>IMDB</th>
                <th>Edit</th>
                <th>Remove</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <div class="pagination"></div>
      </main>

      <div class="movie-overlay" id="movieModal">
        <div class="movie-modal">
          <i class="fa-solid fa-xmark close-modal" id="closeModal"></i>
          <div class="modal-content">
            <div class="modal-left">
              <input type="text" id="titleInput" placeholder="Title" />
              <textarea id="overviewInput" placeholder="Overview"></textarea>
              <input type="text" id="coverInput" placeholder="Cover URL" />
              <input
                type="text"
                id="trailerInput"
                placeholder="Trailer (YouTube embed URL)"
              />
              <input type="text" id="watchInput" placeholder="Watch URL" />
              <input type="text" id="imdbInput" placeholder="IMDB rating" />
              <input
                type="number"
                id="runtimeInput"
                placeholder="Runtime (minutes)"
              />
              <select id="actorSelect" multiple></select>
              <select id="categorySelect">
                <option value="">Category</option>
              </select>
              <label class="adult-check">
                <input type="checkbox" id="adultCheck" />
                Adult
              </label>
              <button class="submit-btn">Submit</button>
            </div>
            <div
              class="modal-right"
              id="coverPreview"
              onclick="document.getElementById('coverInput').focus()"
            >
              <div
                id="coverPlaceholder"
                style="
                  width: 100%;
                  height: 300px;
                  border: 2px dashed #ffffff20;
                  border-radius: 14px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  color: #ffffff40;
                  font-size: 13px;
                  text-align: center;
                  cursor: pointer;
                  padding: 20px;
                  box-sizing: border-box;
                "
              >
                Add your cover image URL
              </div>
              <img
                id="coverPreviewImg"
                src=""
                alt="preview"
                style="
                  display: none;
                  width: 100%;
                  border-radius: 14px;
                  object-fit: cover;
                "
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../script/admin/movies.js"></script>
    <script src="../../script/admin/pagination.js"></script>
    <script src="../../script/admin/deleteModal.js"></script>
    <script src="../../global/adminGlobal.js" defer></script>
  </body>
</html>
