  <style>
  .contact-table {
    table-layout: fixed;
    width: 100%;
  }

  .contact-table th:nth-child(1),
  .contact-table td:nth-child(1) { width: 60px; text-align: center; }

  .contact-table th:nth-child(2),
  .contact-table td:nth-child(2) { width: 150px; text-align: center; }

  .contact-table th:nth-child(3),
  .contact-table td:nth-child(3) { width: 220px; text-align: center; }

  .contact-table th:nth-child(4),
  .contact-table td:nth-child(4) { width: 200px; text-align: center ; overflow: hidden; }

  .contact-table th:nth-child(5),
  .contact-table td:nth-child(5) { width: 60px; text-align: center; }

  .contact-table td:nth-child(4) .contact-clamp {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
  width: 180px;
  margin: 0 auto; 
}

  .js-tooltip {
    position: fixed;
    background: #1e1e2e;
    color: #e4e4f0;
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 8px;
    max-width: 280px;
    white-space: normal;
    line-height: 1.5;
    text-align: left;
    word-break: break-word;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    border: 1px solid #2e2e3e;
    z-index: 99999;
    pointer-events: none;
    display: none;
  }
</style>
