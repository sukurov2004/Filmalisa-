<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="../../global/reset.css" />
  <link rel="stylesheet" href="../../global/adminGlobal.css" />
  <link rel="stylesheet" href="../../styles/admin/contactus.css" />

  <title>Admin / Contact Us</title>
</head>
<body>
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div>
        <div class="brand">
          <img src="../../assets/Admin/images/logo.svg" alt="logo" />
          <span>filmalisa</span>
        </div>

        <nav class="menu">
          <a href="dashboard.html" class="item">Dashboard</a>
          <a href="movies.html" class="item">Movies</a>
          <a href="categories.html" class="item">Categories</a>
          <a href="users.html" class="item">Users</a>
          <a href="comments.html" class="item">Comments</a>
          <a href="contactus.html" class="item active">Contact us</a>
          <a href="actors.html" class="item">Actors</a>
        </nav>
      </div>

      <a href="login.html" class="logout" id="logoutBtn">
        Logout
      </a>
    </aside>

    <!-- DELETE MODAL -->
    <div class="delete-overlay" id="deleteModal">
      <div class="modal">
        <h2>Delete Message</h2>
        <p>Are you sure you want to delete this message?</p>
        <div class="modal-actions">
          <button class="btn cancel-btn">Cancel</button>
          <button class="btn delete-btn">Delete</button>
        </div>
      </div>
    </div>

    <!-- MAIN -->
    <main class="main">
      <header class="topbar">
        <div>
          <div class="hi">Hi Admin</div>
          <h1>Contact Us</h1>
        </div>
      </header>

      <section class="table-wrapper">
        <table class="movies-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Username</th>
              <th>Email</th>
              <th>Question</th>
              <th>Remove</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <div class="pagination"></div>
    </main>

  </div>

  <!-- JS -->
  <script src="../../script/admin/contactus.js" defer></script>
  <script src="../../global/adminGlobal.js" defer></script>
</body>
</html>
