<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="../../assets/client/İconsİmages/logo.svg"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>Search Result</title>
    <link rel="stylesheet" href="../../global/reset.css" />
    <link rel="stylesheet" href="../../global/clientGlobal.css" />
    <link rel="stylesheet" href="../../styles/client/search.css" />
    <link rel="stylesheet" href="../../styles/client/error.css" />
    <link rel="stylesheet" href="../../styles/client/responsive.css" />
  </head>

  <body>
    <div class="layout">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="side-top">
          <a href="../../index.html">
            <img
              class="logo"
              src="../../assets/client/İconsİmages/logo.svg"
              alt="Logo"
            />
          </a>

          <nav class="side-nav" aria-label="Sidebar navigation">
            <a class="side-link" href="home.html" aria-label="Home">
              <img src="../../assets/client/İconsİmages/home.svg" alt="Home" />
            </a>

            <a class="side-link active" href="search.html" aria-label="Grid">
              <img src="../../assets/client/İconsİmages/grid.svg" alt="Grid" />
            </a>

            <a class="side-link" href="account.html" aria-label="Video">
              <img
                src="../../assets/client/İconsİmages/video.svg"
                alt="Video"
              />
            </a>
            <a class="side-link" href="favorite.html" aria-label="Star">
              <img src="../../assets/client/İconsİmages/star.svg" alt="Star" />
            </a>
          </nav>
        </div>
      </aside>

      <!-- MAIN -->
      <main class="main">
        <!-- TOP BAR -->
        <header class="topbar">
          <div class="title-wrap">
            <h1 class="title">Search result</h1>
            <img
              src="../../assets/client/İconsİmages/vector.svg"
              alt=""
              style="width: 10px"
            />
          </div>

          <div class="search-wrap">
            <input
              id="searchInput"
              class="search"
              type="text"
              placeholder="Search...."
            />
            <button
              id="searchBtn"
              class="search-add"
              type="button"
              aria-label="Search"
            >
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </div>
        </header>

        <section class="grid" id="resultsGrid"></section>
      </main>
    </div>
    <!-- GLOBAL LOADER -->
    <div id="globalLoader" class="loader-overlay">
      <div class="loader">
        <div class="jimu-primary-loading"></div>
      </div>
    </div>
    <script src="../../global/clientGlobal.js"></script>
    <script src="../../script/client/search.js"></script>
  </body>
</html>
