<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Details</title>
    <link
      rel="icon"
      type="image/png"
      href="../../assets/client/İconsİmages/logo.svg"
    />
    <link rel="stylesheet" href="../../global/reset.css" />
    <link rel="stylesheet" href="../../global/clientGlobal.css" />
    <link rel="stylesheet" href="../../styles/client/detailed.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="home-layout">
      <aside class="home-sidebar">
        <div class="home-side-top">
          <a href="../../index.html" class="logo-link">
            <img
              class="home-logo"
              src="../../assets/client/İconsİmages/logo.svg"
              alt="Logo"
            />
          </a>
          <nav class="home-side-nav">
            <a class="home-side-link" href="./home.html">
              <img src="../../assets/client/İconsİmages/home.svg" alt="Home" />
            </a>
            <a class="home-side-link" href="./search.html">
              <img src="../../assets/client/İconsİmages/grid.svg" alt="Grid" />
            </a>
            <a class="home-side-link" href="./account.html">
              <img
                src="../../assets/client/İconsİmages/video.svg"
                alt="Video"
              />
            </a>
            <a class="home-side-link" href="./favorite.html">
              <img src="../../assets/client/İconsİmages/star.svg" alt="Star" />
            </a>
          </nav>
        </div>
      </aside>

      <main class="main-detail">
    <div class="top-header-profile">
  <a href="../../pages/client/account.html">
    <img 
      id="profileAvatar"
      src="../../assets/client/İconsİmages/user.svg" 
      alt="Profile" 
    />
  </a>
</div>

        <div class="hero-container">
          <div class="hero-backdrop">
            <div class="hero-gradient-overlay"></div>
          </div>
          <div class="hero-floating-card">
            <span class="hero-genre"></span>
            <h1 class="hero-movie-name"></h1>
          </div>
        </div>

        <div class="content-wrapper">
          <div class="main-info-container">
            <div class="left-column">
              <div class="poster-card" id="mainPoster">
                <img src="" alt="Movie Poster" />
                <div class="play-overlay" onclick="toggleVideo()">
                  <i class="fa-solid fa-play"></i>
                </div>
              </div>
            </div>

            <div class="right-column">
              <div class="movie-header">
                <div class="header-content">
                  <h2 class="promo-text">About the Movie :</h2>
                  <div class="watch-actions">
                    <button class="btn-watch">Watch Link</button>
                    <button class="circle-btn">
                      <i class="fa-solid fa-heart"></i>
                    </button>
                  </div>
                </div>
              </div>

              <p class="description"></p>

              <div class="rating-row">
                <div class="rating-badge"></div>
              </div>

              <div class="section-block">
                <h3 class="section-title">top cast</h3>
                <div class="cast-list"></div>
              </div>
            </div>
          </div>

          <div class="comments-wrapper-full">
            <div class="comment-input-area">
              <div class="user-avatar-sm">
                <img
                  src="../../assets/client/İconsİmages/user.svg"
                  alt="User"
                />
              </div>
              <input
                type="text"
                placeholder="your comment..."
                class="comment-field"
              />
              <button class="btn-send-comment">
                <img
                  src="../../assets/client/İconsİmages/send.svg"
                  alt="Send"
                />
              </button>
            </div>
          </div>
        </div>
          <div class="similar-wrapper">
            <div class="similar-title">
              <h3>Similar Movies</h3>
              <img src="../../assets/client/İconsİmages/vector.svg" alt="arrow" />
            </div>
            <div class="similar-grid"></div>
          </div>
      </main>
    </div>

    <div id="videoModal" class="modal-overlay">
      <div class="modal-content">
        <div class="close-modal-wrapper">
          <span class="close-modal-btn" onclick="toggleVideo()">×</span>
        </div>

        <!-- Thumbnail + Play -->
        <div
          id="videoThumbnail"
          style="
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            cursor: pointer;
            gap: 16px;
          "
          onclick="playVideo()"
        >
          <img
            id="thumbImg"
            src=""
            style="
              position: absolute;
              inset: 0;
              width: 100%;
              height: 100%;
              object-fit: cover;
              opacity: 0.6;
            "
          />
          <div
            style="
              position: relative;
              z-index: 2;
              width: 70px;
              height: 70px;
              background: rgba(255, 255, 255, 0.15);
              border: 2px solid #fff;
              border-radius: 50%;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <i
              class="fa-solid fa-play"
              style="color: #fff; font-size: 24px; margin-left: 4px"
            ></i>
          </div>
          <span
            style="
              position: relative;
              z-index: 2;
              color: #fff;
              font-size: 14px;
              opacity: 0.8;
            "
            >Click to play trailer</span
          >
        </div>

        <iframe
          id="youtubeFrame"
          width="100%"
          height="100%"
          src=""
          title="Trailer"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
          "
          allowfullscreen
          style="display: none"
        ></iframe>
      </div>
    </div>

    <!-- GLOBAL LOADER -->
    <div id="globalLoader" class="loader-overlay">
      <div class="loader">
        <div class="jimu-primary-loading"></div>
      </div>
    </div>

    <script src="../../global/clientGlobal.js"></script>
    <script src="../../script/client/detailed.js"></script>
  </body>
</html>
