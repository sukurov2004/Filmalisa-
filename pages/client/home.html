<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="../../assets/client/İconsİmages/logo.svg"
    />
    <title>Home</title>
    <link rel="stylesheet" href="../../global/reset.css" />
    <link rel="stylesheet" href="../../global/clientGlobal.css" />
    <link rel="stylesheet" href="../../styles/client/error.css" />
    <link rel="stylesheet" href="../../styles/client/home.css" />
  </head>

  <body>
    <div class="home-layout">
      <!-- SIDEBAR -->
      <aside class="home-sidebar">
        <div class="home-side-top">
          <a href="../../index.html">
            <img
              class="home-logo"
              src="../../assets/client/İconsİmages/logo.svg"
              alt="Logo"
            />
          </a>
          <nav class="home-side-nav">
            <a class="home-side-link active" href="home.html">
              <img src="../../assets/client/İconsİmages/home.svg" alt="" />
            </a>
            <a class="home-side-link" href="search.html">
              <img src="../../assets/client/İconsİmages/grid.svg" alt="" />
            </a>
            <a class="home-side-link" href="account.html">
              <img src="../../assets/client/İconsİmages/video.svg" alt="" />
            </a>
            <a class="home-side-link" href="favorite.html">
              <img src="../../assets/client/İconsİmages/star.svg" alt="" />
            </a>
          </nav>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main">
        <!-- HERO SLIDER -->
        <div class="hero-slider" id="heroSlider">
          <div class="hero-slides-wrapper" id="heroWrapper"></div>
          <div class="hero-dots" id="heroDots"></div>
        </div>

        <!-- Categories genereted with JS -->
        <div id="categoriesContainer"></div>
      </main>
    </div>
    <!-- GLOBAL LOADER -->
    <div id="globalLoader" class="loader-overlay">
      <div class="loader">
        <div class="jimu-primary-loading"></div>
      </div>
    </div>
    <script src="../../global/clientGlobal.js"></script>
    <script src="../../script/client/home.js"></script>
  </body>
</html>
